plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.20"
}

apply plugin: "com.facebook.react"

repositories {
    flatDir { dirs 'libs' }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.visiomovandroid"
    defaultConfig {
        applicationId "com.visiomovandroid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // VisioMove Essential (place VisioMoveEssential.aar in app/libs/)
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-reflect:${rootProject.ext.kotlinVersion}"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Jetpack Compose (used to host the VME map view in a Compose tree)
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

/**
 * Optional helper task: downloads and extracts VisioMoveEssential.aar when missing.
 * This keeps the repo free of proprietary binaries while still enabling a one-command setup.
 */
def visioMoveAarFile = file("$projectDir/libs/VisioMoveEssential.aar")
def visioMoveSdkZipUrl =
        System.getenv("VISIOMOVE_SDK_ZIP_URL") ?:
                "https://my.visioglobe.com/sdks/VisioMoveEssential-Android-2.7.0-20260123.zip"
def visioMoveSdkZipFile = file("$buildDir/VisioMoveEssential-Android-SDK.zip")

tasks.register("prepareVisioMoveEssentialAar") {
    outputs.file(visioMoveAarFile)
    doLast {
        if (visioMoveAarFile.exists()) {
            logger.lifecycle("VisioMoveEssential.aar already present at ${visioMoveAarFile}")
            return
        }

        logger.lifecycle("Downloading VisioMove Essential SDK zip from ${visioMoveSdkZipUrl}")
        visioMoveAarFile.parentFile.mkdirs()
        visioMoveSdkZipFile.parentFile.mkdirs()

        try {
            new URL(visioMoveSdkZipUrl).withInputStream { input ->
                visioMoveSdkZipFile.withOutputStream { output -> output << input }
            }
        } catch (Throwable t) {
            throw new GradleException(
                    "Failed to download VisioMove SDK zip. " +
                            "Either set VISIOMOVE_SDK_ZIP_URL to a reachable URL, " +
                            "or manually copy VisioMoveEssential.aar into android/app/libs/.",
                    t
            )
        }

        try {
            def zipFile = new java.util.zip.ZipFile(visioMoveSdkZipFile)
            def enumeration = zipFile.entries()
            def entry = null
            while (enumeration.hasMoreElements()) {
                def e = enumeration.nextElement()
                if (!e.isDirectory() && e.name.endsWith("VisioMoveEssential.aar")) {
                    entry = e
                    break
                }
            }
            if (entry == null) {
                throw new GradleException("VisioMoveEssential.aar not found inside downloaded zip: ${visioMoveSdkZipFile}")
            }
            zipFile.getInputStream(entry).withCloseable { input ->
                visioMoveAarFile.withOutputStream { output -> output << input }
            }
            zipFile.close()
            logger.lifecycle("Extracted VisioMoveEssential.aar to ${visioMoveAarFile}")
        } catch (Throwable t) {
            throw new GradleException(
                    "Failed to extract VisioMoveEssential.aar from zip. " +
                            "You can manually copy VisioMoveEssential.aar into android/app/libs/.",
                    t
            )
        }
    }
}

// Ensure the AAR exists before Java/Kotlin compilation.
preBuild.dependsOn(tasks.named("prepareVisioMoveEssentialAar"))
